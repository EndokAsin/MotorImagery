<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EEG Timeline – Offset Fiksasi</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a202c;
      color: #e2e8f0;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1300px;
      margin: auto;
      background: #2d3748;
      padding: 25px;
      border-radius: 12px;
    }
    h1 {
      color: #63b3ed;
      margin-top: 0;
    }
    .section {
      background: #1a202c;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #4a5568;
    }
    .flex-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #cbd5e0;
    }
    input, select, button {
      padding: 8px 12px;
      border: 1px solid #4a5568;
      background: #2d3748;
      color: white;
      border-radius: 5px;
    }
    button {
      background: #3182ce;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #2b6cb0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a202c;
      border-radius: 8px;
      margin-top: 15px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #4a5568;
      font-size: 0.85rem;
    }
    th {
      background: #2c3e50;
      color: #a0aec0;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .bg-blue { background: #2b6cb0; color: white; }
    .bg-purple { background: #805ad5; color: white; }
    .error {
      color: #fc8181;
      background: #742a2a;
      padding: 8px;
      border-radius: 4px;
    }
    .hidden { display: none; }
    .info { font-size: 0.8rem; color: #a0aec0; }
  </style>
</head>
<body>
<div class="container">
  <h1>🧠 Timeline EEG Relatif – Offset Fiksasi</h1>

  <div class="section">
    <div class="flex-row">
      <div>
        <label>1. Muat CSV eksperimen</label>
        <input type="file" id="csvFileInput" accept=".csv">
      </div>
      <div>
        <label>2. Pilih Subjek</label>
        <select id="subjectSelect"><option value="">-- Muat CSV dulu --</option></select>
      </div>
      <div>
        <label>3. Filter Sesi (opsional)</label>
        <select id="sessionFilter"><option value="">Semua sesi</option></select>
      </div>
      <div>
        <label>4. Jam EEG saat Fiksasi Pertama</label>
        <input type="text" id="eegBaseline" placeholder="00:04:23" style="width:100px;">
        <div class="info">Format HH:MM:SS (waktu di alat EEG begitu fiksasi "+" muncul)</div>
      </div>
      <div style="align-self: center;">
        <button id="processBtn">⚡ Proses</button>
      </div>
    </div>
    <div id="errorMsg" class="error hidden"></div>
  </div>

  <div id="resultSection" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>📋 Subjek: <span id="currentSubjectLabel"></span> | Sesi: <span id="currentSessionLabel"></span></h3>
      <button id="downloadBtn">⬇️ Unduh CSV</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Sesi</th>
          <th>Mode</th>
          <th>Instruksi</th>
          <th>Selisih dari trial 1 (hh:mm:ss)</th>
          <th>EEG rel start (hh:mm:ss)</th>
          <th>EEG rel end (hh:mm:ss)</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  const csvInput = document.getElementById('csvFileInput');
  const subjectSelect = document.getElementById('subjectSelect');
  const sessionFilter = document.getElementById('sessionFilter');
  const eegBaselineInput = document.getElementById('eegBaseline');
  const processBtn = document.getElementById('processBtn');
  const errorDiv = document.getElementById('errorMsg');
  const resultSection = document.getElementById('resultSection');
  const currentSubjectLabel = document.getElementById('currentSubjectLabel');
  const currentSessionLabel = document.getElementById('currentSessionLabel');
  const tableBody = document.getElementById('tableBody');
  const downloadBtn = document.getElementById('downloadBtn');

  let csvRows = [];
  let subjects = [];
  let sessionsSet = new Set();

  function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current.trim());
    return result;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m] || m);
  }

  function showError(msg) {
    errorDiv.textContent = msg;
    errorDiv.classList.remove('hidden');
  }

  function hideError() {
    errorDiv.textContent = '';
    errorDiv.classList.add('hidden');
  }

  function timeToSeconds(hhmmss) {
    const parts = hhmmss.split(':');
    if (parts.length !== 3) return NaN;
    const h = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    const s = parseInt(parts[2], 10);
    if (isNaN(h) || isNaN(m) || isNaN(s)) return NaN;
    return h * 3600 + m * 60 + s;
  }

  function formatSecondsToHMS(sec) {
    if (sec === null || sec === undefined) return '-';
    const isNeg = sec < 0;
    const abs = Math.abs(sec);
    const hrs = Math.floor(abs / 3600);
    const mins = Math.floor((abs % 3600) / 60);
    const secs = Math.round(abs % 60);
    return `${isNeg ? '-' : ''}${hrs.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
  }

  csvInput.addEventListener('change', () => {
    const file = csvInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const text = e.target.result;
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
      if (lines.length < 2) {
        showError('File CSV kosong.');
        return;
      }
      const header = parseCSVLine(lines[0]);
      const idxSubject = header.findIndex(h => h === 'SubjectID');
      const idxSession = header.findIndex(h => h === 'SessionType');
      if (idxSubject === -1) {
        showError('Kolom SubjectID tidak ditemukan.');
        return;
      }
      csvRows = [];
      const subjectSet = new Set();
      sessionsSet.clear();
      for (let i = 1; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        if (cols.length < header.length) continue;
        const subj = cols[idxSubject];
        if (!subj) continue;
        subjectSet.add(subj);
        if (idxSession !== -1) sessionsSet.add(cols[idxSession]);
        csvRows.push({ cols, header });
      }
      subjects = Array.from(subjectSet).sort();
      subjectSelect.innerHTML = '<option value="">-- Pilih Subjek --</option>';
      subjects.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        subjectSelect.appendChild(opt);
      });
      updateSessionFilter();
      hideError();
      resultSection.classList.add('hidden');
    };
    reader.readAsText(file);
  });

  function updateSessionFilter() {
    sessionFilter.innerHTML = '<option value="">Semua sesi</option>';
    Array.from(sessionsSet).sort().forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      sessionFilter.appendChild(opt);
    });
  }

  processBtn.addEventListener('click', () => {
    hideError();
    const selectedSubject = subjectSelect.value;
    if (!selectedSubject) {
      showError('Pilih subjek terlebih dahulu.');
      return;
    }
    const selectedSession = sessionFilter.value;
    const baselineStr = eegBaselineInput.value.trim();
    if (!/^\d{1,2}:\d{2}:\d{2}$/.test(baselineStr)) {
      showError('Masukkan jam EEG saat fiksasi pertama (HH:MM:SS).');
      return;
    }
    const baselineSec = timeToSeconds(baselineStr);
    if (isNaN(baselineSec)) {
      showError('Format jam EEG tidak valid.');
      return;
    }

    let subjectRows = csvRows.filter(r => r.cols[r.header.findIndex(h => h === 'SubjectID')] === selectedSubject);
    if (selectedSession) {
      subjectRows = subjectRows.filter(r => r.cols[r.header.findIndex(h => h === 'SessionType')] === selectedSession);
    }
    if (subjectRows.length === 0) {
      showError('Tidak ada data untuk filter ini.');
      return;
    }

    const idxTimestamp = subjectRows[0].header.findIndex(h => h === 'Timestamp');
    const idxInstr = subjectRows[0].header.findIndex(h => h === 'Instruction');
    const idxSession = subjectRows[0].header.findIndex(h => h === 'SessionType');
    const idxMode = subjectRows[0].header.findIndex(h => h === 'Mode');
    const idxTrial = subjectRows[0].header.findIndex(h => h === 'TrialNumber');

    const trials = [];
    subjectRows.forEach(row => {
      const tsStr = row.cols[idxTimestamp];
      if (!tsStr) return;
      const trialDate = new Date(tsStr);
      if (isNaN(trialDate.getTime())) return;
      trials.push({
        session: row.cols[idxSession] || '',
        mode: row.cols[idxMode] || '',
        trial: row.cols[idxTrial] || '',
        instruction: row.cols[idxInstr] || '',
        time: trialDate.getTime()
      });
    });

    trials.sort((a,b) => a.time - b.time);
    if (trials.length === 0) {
      showError('Tidak ada trial yang valid.');
      return;
    }

    const t0 = trials[0].time;

    const results = trials.map(t => {
      const deltaSec = (t.time - t0) / 1000;
      const eegAbsSec = baselineSec + deltaSec + 4.0; // aksi pertama 4 detik setelah fiksasi
      return {
        ...t,
        deltaSec,
        deltaFormatted: formatSecondsToHMS(deltaSec),
        eegStartSec: eegAbsSec,
        eegEndSec: eegAbsSec + 4.0,
        startFormatted: formatSecondsToHMS(eegAbsSec),
        endFormatted: formatSecondsToHMS(eegAbsSec + 4.0)
      };
    });

    tableBody.innerHTML = '';
    results.forEach((r, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${i+1}</td>
        <td>${escapeHtml(r.session)}</td>
        <td><span class="badge ${r.mode==='ME'?'bg-blue':'bg-purple'}">${r.mode}</span></td>
        <td style="color:${r.instruction==='Extension'?'#68d391':'#f6ad55'}; font-weight:bold;">${r.instruction}</td>
        <td>${r.deltaFormatted}</td>
        <td><strong>${r.startFormatted}</strong></td>
        <td>${r.endFormatted}</td>
      `;
      tableBody.appendChild(tr);
    });

    currentSubjectLabel.textContent = selectedSubject;
    currentSessionLabel.textContent = selectedSession || 'Semua sesi';
    resultSection.classList.remove('hidden');

    downloadBtn.onclick = () => {
      let csvContent = "SubjectID,SessionType,Mode,TrialNumber,Instruction,Delta_sec,Delta_hhmmss,EEG_Rel_Start,EEG_Rel_End\n";
      results.forEach(r => {
        csvContent += `"${selectedSubject}","${r.session}","${r.mode}","${r.trial}","${r.instruction}",${r.deltaSec.toFixed(3)},${r.deltaFormatted},${r.startFormatted},${r.endFormatted}\n`;
      });
      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `eeg_rel_${selectedSubject}${selectedSession?'_'+selectedSession:''}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };
  });
</script>
</body>
</html>
